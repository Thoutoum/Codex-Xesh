"NON-COMBATTANT": "Une figurine dotée de CE mot-clé ne peut pas ajouter d'armes aux réserves d'attaque, et les blessures doivent être attribuées à des figurines autres que des Chefs d'unité n'étant pas dotées du mot-clé Non-combattant, si possible. Si une figurine dotée de CE mot-clé possède déjà un ou plusieurs pions Blessure, elle doit se voir attribuer des blessures avant les figurines qui ne possèdent pas de pions Blessure. Si la figurine de Chef d'unité d'une unité dotée du mot-clé Non-combattant est vaincue, une figurine Non-combattante ne peut pas être remplacée par une nouvelle figurine de Chef d'unité sauf s'il n'y a pas d'autres figurines n'étant pas dotées du mot-clé Non-combattant.", 

"PERMANENT": "Certaines cartes Commandement sont dotées de CE mot-clé. Contrairement aux cartes Commandement ordinaires, ces cartes ne sont pas défaussées pendant la Phase Finale et leurs effets persistent tant qu'elles sont en jeu.", 

"PETIT": "Une unité comprenant 1 ou plusieurs figurines Alter Ego dotées de CE mot-clé ne peut pas être ciblée par des attaques si le Chef de l'unité attaquante n'a une LdV que vers la figurine Alter Ego dotée du mot-clé Petit.", 

"PIONS BANE": "Cad Bane dispose de trois pions Bane uniques qu'il peut placer sur le champ de bataille. Les pions Bane sont recto verso : un côté uniformisé (face cachée) et un côté comportant une image parmi trois différentes, chacune déclenchant un effet unique (face visible). Les pions Bane doivent être placés face cachée sur le champ de bataille et ils ne peuvent pas chevaucher de pions Objectif et Avantage. Les pions Bane sont des effets ennemis et chaque joueur ne peut posséder qu'un exemplaire de chaque pion Bane sur le champ de bataille à la fois. Lorsqu'une figurine ennemie se déplace, se déploie ou est placée à PORTÉE 1 d'un pion Bane ennemi, si cette figurine a une LdV vers le pion, ce dernier est révélé. Les figurines peuvent se déplacer à travers les pions Bane, mais pas les chevaucher. Lorsqu'un pion Bane est révélé, il a l'un des effets suivants : <br>Me voilà : si Cad Bane ne se trouve pas sur le champ de bataille et n'est pas vaincu, son pion Me voilà est remplacé par sa figurine. Ensuite, Cad Bane se donne un ordre à lui-même. <br> • Si Cad Bane se trouve sur le champ de bataille, son pion Me voilà est remplacé par sa figurine. Tout pion attribué à Cad Bane lui reste attribué. <br> • Si Cad Bane est vaincu, retirez ce pion. <br> • Au début de chaque round, en commençant par le joueur bleu, un joueur peut révéler un pion Me voilà allié et résoudre ses effets. <br>Fumée et miroir : le pion est retiré. <br>Kablamo ! : le pion explose en utilisant le profil d'arme indiqué sur la carte Commandement de Cad Bane « Je Fixe les Règles à Présent ». Ensuite, le pion est retiré.", 

"PIONS GRAFFITI": "Un pion Graffiti (Avantage) représente une image ou un signe au fort pouvoir symbolique tagué sur le terrain du champ de bataille. Les pions Graffiti ont un effet sur le moral d'une unité, ils sont recto verso et doivent être placés à plat avec comme face visible la couleur correspondant au joueur les contrôlant. Pendant l'étape « Se rallier » de l'activation d'une unité, elle peut lancer un dé supplémentaire si elle a une LdV vers et se trouve à PORTÉE 2 d'un pion Graffiti placé par une figurine alliée. Elle doit lancer un dé de moins (jusqu'à un minimum de 1 dé) si elle a une LdV et se trouve à PORTÉE 2 d'un pion Graffiti placé par une figurine ennemie. Les pions Graffiti restent en jeu jusqu'à la fin de la partie. Les unités peuvent se déplacer au travers des pions Graffiti et terminer leurs déplacements en chevauchant ces derniers.", 

"RECONFIGURATION": "Lorsqu'une unité équipée d'une carte Amélioration dotée de CE mot-clé récupère ou effectue une action Récupérer, le joueur qui contrôle cette unité peut retourner cette carte Amélioration sur son autre face en plus de tout effet lié à la récupération. Si une carte Amélioration affiche l'icône Incliner, utiliser la capacité Reconfiguration ne provoque pas l'inclinaison de cette carte Amélioration.", 

"REPARATION X : CAPACITE Y": "Lorsqu'une unité utilise l'action de carte Réparation X : Capacité Y, choisissez une unité de soldats droïdes ou de véhicule alliée à PORTÉE 1 et en LdV et placez un pion Blessure sur la carte dotée de CE mot-clé. Retirez au total jusqu'à X pions Blessure, Ionique et/ou Dégât de véhicule de l'unité choisie ou restaurez jusqu'à X figurines de cette unité. Cette capacité ne peut pas être utilisée si la carte dotée de CE mot-clé possède sur elle un nombre de pions Blessure supérieur ou égal à Y. Les pions Blessure placés sur des cartes ne sont pas considérés comme possédés par des unités et ne comptent pas dans le seuil de blessure de cette unité. Ils ne peuvent pas non plus être retirés par des capacités qui retirent des pions Blessure à des unités. Si une unité dispose de plusieurs capacités Réparation X : Capacité Y, considérez chaque mot-clé comme une capacité à part. De plus, chaque action est considérée comme unique, et une unité qui a accès à plusieurs d'entre elles ne peut utiliser chaque capacité qu'une seule fois au cours de son activation. Cette règle s'applique même si l'unité a accès à deux capacités identiques de différentes sources.", 

"RESTAURATION": "Certaines capacités, comme les mots clés Traiter et Réparation, de même que certains effets de carte, permettent à un joueur de restaurer des figurines dans des unités alliées. Pour restaurer une figurine dans une unité, une ou plusieurs figurines de cette unité doivent avoir été vaincues ce round. Choisissez une figurine qui a été vaincue pendant le round en cours et placez cette figurine sur le champ de bataille en cohésion avec son Chef d'unité. Ensuite, donnez à cette figurine un nombre de pions Blessure égal au seuil de blessure indiqué sur sa carte Unité ou Amélioration moins un.", 

"TRAITER X : CAPACITE Y": "Lorsqu'une unité utilise l'action de carte Traiter X : Capacité Y, choisissez une unité de soldats non-droïdes alliée à PORTEE 1 et en LdV et placez un pion Blessure sur la carte dotée de CE mot-clé. Retirez au total jusqu'à X pions Blessure et/ou Poison de l'unité choisie ou restaurez jusqu'à X figurines dans cette unité. Cette capacité ne peut pas être utilisée si la carte dotée de CE mot-clé possède sur elle un nombre de pions Blessure supérieur ou égal à Y. 63 Les pions Blessure placés sur des cartes ne sont pas considérés comme possédés par des unités et ne comptent pas dans le seuil de blessure de cette unité. Ils ne peuvent pas non plus être retirés par des capacités qui retirent des pions Blessure à des unités. Si une unité dispose de plusieurs capacités Traiter X : Capacité Y, considérez chaque mot-clé comme une capacité à part. De plus, chaque action est considérée comme unique, et une unité qui a accès à plusieurs d'entre elles ne peut utiliser chaque capacité qu'une seule fois au cours de son activation. Cette règle s'applique même si l'unité a accès à deux capacités identiques de différentes sources.",
    };

    // 2. CORRESPONDANCE DES ICÔNES
    const BASE_URL = "https://raw.githubusercontent.com/Thoutoum/Codex-Xesh/main/";
    const ICONES = {
        "[BLOCK]": "Block.webp",
        "[HIT]": "Hit.webp",
        "[CRIT]": "Critical_hit.webp",
        "[D_SURGE]": "Defense_surge.webp",
        "[A_SURGE]": "Attack_surge.webp",
        "[COMMANDANT]": "COMMANDANT.webp",    
        "[AGENT]": "AGENT.webp",
        "[TROUPIER]": "TROUPIER.webp",
        "[FORCE_SPECIALE]": "FORCE_SPECIALE.webp",
        "[SOUTIEN]": "SOUTIEN.webp",
        "[LOURD]": "LOURD.webp",      
        "[ARMEMENT]": "ARMEMENT.webp",
        "[ARME_LOURDE]": "ARME_LOURDE.webp",
        "[ARTILLERIE]": "ARTILLERIE.webp",
        "[CHEF_ESCOUADE]": "CHEF_ESCOUADE.webp",
        "[COMM]": "COMM.webp",      
        "[COMMANDEMENT]": "COMMANDEMENT.webp",  
        "[DOCTRINE]": "DOCTRINE.webp",
        "[ENTRAINEMENT]": "ENTRAINEMENT.webp", 
        "[EQUIPAGE]": "EQUIPAGE.webp",    
        "[EQUIPEMENT]": "EQUIPEMENT.webp",   
        "[FORCE]": "FORCE.webp",
        "[GENERATEUR]": "GENERATEUR.webp",
        "[GRENADE]": "GRENADE.webp",   
        "[PERSONNEL]": "PERSONNEL.webp",  
        "[PILOTE]": "PILOTE.webp",  
        "[POINT_ACCROCHE]": "POINT_ACCROCHE.webp",
        "[PROGRAMMATION]": "PROGRAMMATION.webp"
    };

    // Initialisation du menu déroulant
    const select = document.getElementById("keywordSelect");
    Object.keys(MOTS_CLES).sort().forEach(cle => {
        let opt = document.createElement("option");
        opt.value = cle;
        opt.textContent = cle;
        select.appendChild(opt);
    });

    // Remplacement des tags par du HTML <img>
    function formatterTexte(texte) {
        let t = texte;
        for (let [tag, fichier] of Object.entries(ICONES)) {
            let imgHtml = `<img src="${BASE_URL}${fichier}" class="icon-symbol" alt="${tag}">`;
            t = t.replaceAll(tag, imgHtml);
        }
        return t;
    }

    // Affichage de la règle
    function afficherRegle() {
        const val = select.value;
        const card = document.getElementById("resultCard");
        if (val && MOTS_CLES[val]) {
            document.getElementById("ruleTitle").textContent = "🔍 " + val;
            document.getElementById("ruleContent").innerHTML = formatterTexte(MOTS_CLES[val]);
            card.style.display = "block";
        } else {
            card.style.display = "none";
        }
    }

    // Réinitialisation
    function reinitialiser() {
        select.value = "";
        afficherRegle();
    }
</script>
